<style>
:root{
  --ink:#fff; --ink2:rgba(255,255,255,.74); --ink3:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.12); --glass2:rgba(255,255,255,.2); --line:rgba(255,255,255,.22);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--b);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;

.bg .pat{position:absolute;font-size:44px;opacity:.13;filter:saturate(.8);user-select:none;animation:float 14s ease-in-out infinite}
.bg .hero{position:absolute;right:-40px;top:70px;font-size:260px;opacity:.16;transform:rotate(-12deg);filter:blur(1px)}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 104px)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:28px;
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 20px 50px rgba(0,0,0,.35)}
.pad{padding:22px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
h2{font-size:22px;letter-spacing:-.01em;margin:0 0 10px;font-weight:700}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:0 0 8px;font-weight:600}
p{margin:0 0 10px;line-height:1.45;color:var(--ink2);font-size:16px}
.big{font-size:19px;color:var(--ink);line-height:1.4}
.sp{height:14px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.chip{padding:14px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-align:left;font-size:17px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chip small{font-size:12px;color:var(--ink3);font-weight:500}
.chip.sel{background:var(--ink);color:#111}
.chip.sel small{color:#555}
.field{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:28px;letter-spacing:.5em;text-align:center;outline:none}
.field.txt{font-size:20px;letter-spacing:0}
.btn{width:100%;padding:17px;border-radius:20px;border:0;background:var(--ink);color:#111;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.err{color:#ff8a80;font-size:15px;margin-top:10px;min-height:20px}
.emoji{font-size:84px;line-height:1;margin:4px 0 10px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.4))}
.tag{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--glass2);font-size:13px;font-weight:600;color:var(--ink)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:12px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.4;color:var(--ink2)}
.list li:first-child{border-top:0}
.list b{color:var(--ink)}
.stack>*+*{margin-top:14px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:5;display:flex;gap:4px;padding:6px;border-radius:30px;width:min(492px,calc(100% - 28px))}
.tab{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:24px;font-size:11px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab span{font-size:21px}
.tab.on{background:var(--glass2);color:var(--ink)}
.reveal{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.reveal .inner{filter:blur(16px);transition:filter .2s}
.reveal.open .inner{filter:none}
.reveal .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:rgba(0,0,0,.2)}
.reveal.open .hint{display:none}
.victim{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:2px 0 4px}
.count{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl .it{position:relative;padding:4px 0 12px}
.tl .it:before{content:"";position:absolute;left:-21px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.small{font-size:13px;color:var(--ink3)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.link{background:none;border:0;color:var(--ink3);font-size:14px;cursor:pointer;padding:6px}
.hidden{display:none!important}

/* ===== v3: misterio y movimiento ===== */
.bg:before{content:"";position:absolute;inset:-20%;z-index:1;pointer-events:none;
  background:radial-gradient(40% 30% at 20% 30%,rgba(255,255,255,.07),transparent 70%),radial-gradient(45% 35% at 80% 70%,rgba(255,255,255,.06),transparent 70%);
  animation:fog 22s ease-in-out infinite alternate}
.bg:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.75) 100%);animation:flick 5s steps(1) infinite}
@keyframes fog{to{transform:translate(8%,-6%) scale(1.15)}}
@keyframes flick{0%,100%{opacity:1}46%{opacity:1}47%{opacity:.82}48%{opacity:1}71%{opacity:.9}72%{opacity:1}}
.ember{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);opacity:0;z-index:1;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-105vh) translateX(30px)}}
.app>.stack>*,.app>.top{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.app>.stack>*:nth-child(2){animation-delay:.12s}.app>.stack>*:nth-child(3){animation-delay:.24s}
.app>.stack>*:nth-child(4){animation-delay:.36s}.app>.stack>*:nth-child(5){animation-delay:.48s}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(6px)}}
h1{text-shadow:0 0 28px color-mix(in srgb,var(--accent) 55%,transparent)}
.emoji{animation:pulse 3.4s ease-in-out infinite;filter:drop-shadow(0 0 26px var(--accent))}
@keyframes pulse{50%{transform:scale(1.07) rotate(-3deg)}}
.glitch{position:relative;display:inline-block}
.glitch:before,.glitch:after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;opacity:0}
.glitch:before{color:#ff2a4d;animation:gl1 4s infinite steps(1);clip-path:inset(0 0 55% 0)}
.glitch:after{color:#35e0ff;animation:gl2 4s infinite steps(1);clip-path:inset(55% 0 0 0)}
@keyframes gl1{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,1px);opacity:.8}95%{transform:translate(3px,-1px);opacity:.8}96%{opacity:0}}
@keyframes gl2{0%,92%,100%{transform:none;opacity:0}94%{transform:translate(3px,1px);opacity:.8}96%{transform:translate(-3px,-1px);opacity:.8}97%{opacity:0}}
.stamp{position:absolute;right:16px;bottom:18px;border:2px solid var(--accent);color:var(--accent);padding:3px 10px;border-radius:6px;
  font-weight:800;font-size:12px;letter-spacing:.2em;transform:rotate(8deg);opacity:0;animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(8deg) scale(2.6)}to{opacity:.9;transform:rotate(8deg) scale(1)}}
.rel{position:relative}
.drip{height:3px;border-radius:3px;margin:10px 0 0;width:0;background:linear-gradient(90deg,var(--accent),transparent);animation:grow 1.2s .3s ease-out forwards}
@keyframes grow{to{width:70%}}
.count.pulse{animation:cd 1s infinite;text-shadow:0 0 24px var(--accent)}
@keyframes cd{50%{opacity:.55}}
.lock{font-size:46px;animation:shake 5s infinite;display:inline-block}
@keyframes shake{0%,90%,100%{transform:none}92%{transform:rotate(-12deg)}94%{transform:rotate(10deg)}96%{transform:rotate(-8deg)}98%{transform:rotate(4deg)}}
.reveal{border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--accent) 35%,transparent) inset}
.reveal:before{content:"";position:absolute;left:0;right:0;height:2px;z-index:2;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 2.4s linear infinite;box-shadow:0 0 14px var(--accent)}
.reveal.open:before{display:none}
@keyframes scan{from{top:0}to{top:100%}}
.reveal.open .victim{animation:rv .6s both}
@keyframes rv{from{letter-spacing:.4em;opacity:0;filter:blur(8px)}}
.reveal .hint{flex-direction:column;gap:4px;letter-spacing:.06em}
.reveal .hint span{font-size:30px;animation:pulse 2s infinite}
.intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;transition:opacity 1s}
.intro.out{opacity:0;pointer-events:none}
.intro .pig{font-size:90px;animation:pulse 2s infinite;filter:drop-shadow(0 0 30px #ff2a4d)}
.intro .l1{font-size:25px;font-weight:800;letter-spacing:.02em;margin-top:18px;min-height:64px;color:#fff;max-width:340px}
.intro .slash{position:absolute;left:-10%;top:50%;width:120%;height:5px;background:linear-gradient(90deg,transparent,#ff2a4d,#fff,#ff2a4d,transparent);transform:rotate(-14deg) scaleX(0);box-shadow:0 0 30px #ff2a4d;opacity:0}
.intro.cut .slash{animation:slash .5s forwards}
@keyframes slash{0%{transform:rotate(-14deg) scaleX(0);opacity:1}60%{transform:rotate(-14deg) scaleX(1);opacity:1}100%{transform:rotate(-14deg) scaleX(1);opacity:0}}
.intro.cut .pig{animation:split .6s forwards}
@keyframes split{to{transform:translateY(-14px) rotate(-8deg);opacity:0;filter:blur(6px)}}
.chip{transition:transform .15s,background .2s}.chip:active{transform:scale(.95)}
.chip.sel{box-shadow:0 0 22px rgba(255,255,255,.5)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

 ["🍽️","Tarde y cena","Normas del pueblo: quien las incumpla, bebe."],
 ["⚖️","Sobremesa · Juicio de la Matanza","En corro y por turnos, cada uno acusa a quien cree que va a por él. Si acierta, bebe el acusado; si falla, bebe él. El Padrino hace de juez."],
 ["🎶","Escuelas · Canción maldita","Cada uno tiene la suya (en su tarjeta). Cuando suena: o sales a bailar o bebes."],
 ["☠️","Toda la noche · Chupito de luto","Cada vez que alguien muere, se toma un chupito con su asesino."],
 ["🏆","4:00 · Premios","Mejor disfraz (votación de todos) y quien más haya matado."],
];

/* ============ SERVIDOR (Supabase) o MODO PRUEBA ============ */
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
            del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function rpc(fn, args){
  if(CFG){
    const r = await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{"Content-Type":"application/json",apikey:CFG.key,Authorization:"Bearer "+CFG.key},body:JSON.stringify(args||{})});
    const j = await r.json().catch(()=>null);
    if(!r.ok) throw new Error((j&&(j.message||j.hint))||"Error de conexión");
    return j;
  }
  return mock(fn,args||{});
}

/* Modo prueba: simula el servidor en este navegador. ?ahora en la URL desbloquea las misiones. */
function mock(fn,a){
  const base={Mario:1,Marco:2,Monti:3,Alba:4,Vero:5,Alicia:6,Sandra:7,Ignacio:8,"Pablo Blanco":9,"Rubén":10,Elena:11,Juanjo:12,Ismael:13,Carlos:16,Carmen:15,Sabina:null,Manu:14};
  const db = LS.get("mock.db2",null) || {roster:base,players:{},missions:null};
  const start = new URL(location.href).searchParams.has("ahora") ? new Date(Date.now()-1000) : new Date("2026-11-07T17:00:00+01:00");
  const save=()=>LS.set("mock.db2",db), rnd=n=>1+Math.floor(Math.random()*n);
  const names=()=>Object.keys(db.roster).sort((x,y)=>x.localeCompare(y,"es"));
  if(fn==="matanza_join"){ const n=(a.p_name||"").trim().replace(/\s+/g," "); if(n.length<2) throw new Error("Escribe tu nombre (2 a 24 letras)");
    let f=names().find(x=>x.toLowerCase()===n.toLowerCase()); if(!f){ db.roster[n]=null; f=n; } save();
    return {name:f,roster:names(),claimed:Object.keys(db.players)}; }
  if(fn==="matanza_status") return {roster:names(),claimed:Object.keys(db.players),start_at:start.toISOString(),now:new Date().toISOString()};
  if(!/^\d{4}$/.test(a.p_pin)) throw new Error("El PIN son 4 cifras");
  if(!(a.p_name in db.roster)) throw new Error("Ese nombre no está en la lista");
  let p=db.players[a.p_name], late=false;
  if(!p) p=db.players[a.p_name]={pin:a.p_pin,s:rnd(24)};
  else if(p.pin!==a.p_pin) throw new Error("PIN incorrecto");
  const started = Date.now()>=start;
  if(started && !db.missions){ const ns=Object.keys(db.players).sort(()=>Math.random()-.5); db.missions={};
    ns.forEach((n,i)=>db.missions[n]={t:ns[(i+1)%ns.length],a:rnd(30)}); }
  save(); const m=db.missions&&db.missions[a.p_name]; if(started&&!m) late=true;
  return {name:a.p_name,character_id:db.roster[a.p_name],song_id:p.s,start_at:start.toISOString(),now:new Date().toISOString(),started,late,target:m?m.t:null,action_id:m?m.a:null};
}

/* ============ INTERFAZ ============ */
const $ = s=>document.querySelector(s);
const app=$("#app"), tabsEl=$("#tabs"), bg=$("#bg");
let S={status:null, sel:null, me:null, tab:"tarjeta", err:"", skew:0, join:false};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate=iso=>new Date(iso).toLocaleString("es-ES",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Madrid"});

function paintBg(ch){
  const r=document.documentElement.style;
  if(ch){ r.setProperty("--a",ch.a); r.setProperty("--accent",ch.acc); }
  else { r.setProperty("--a","#3a0a12"); r.setProperty("--accent","#ff453a"); }
  const pat = ch?ch.pat:["🐷","🔪","🍷","🎂"];
  let h = `<div class="hero">${ch?ch.e:"🐷"}</div>`;
  for(let i=0;i<16;i++){ const x=(i*37)%100, y=(i*61)%100, d=(i%5)*1.7;
    h+=`<div class="pat" style="left:${x}%;top:${y}%;animation-delay:-${d}s">${pat[i%pat.length]}</div>`; }
  for(let i=0;i<14;i++){ h+=`<div class="ember" style="left:${(i*73)%100}%;animation-duration:${7+(i*3)%8}s;animation-delay:-${(i*2.3)%9}s"></div>`; }
  bg.innerHTML=h;
}

/* ---- Entrada ---- */
function loginView(){
  paintBg(null); tabsEl.classList.add("hidden");
  const st=S.status||{roster:[],claimed:[]};
  const chips = st.roster.map(n=>{const c=st.claimed.includes(n);
    return `<button class="chip ${S.sel===n?"sel":""}" data-n="${esc(n)}">${esc(n)}<small>${c?"🔒":"nuevo"}</small></button>`}).join("");
  const first = S.sel && !st.claimed.includes(S.sel);
  app.innerHTML = `
  <div class="stack">
    <div class="glass pad">
      <div class="eyebrow">Cañaveras · Sábado 7 de noviembre</div>
      <h1><span class="glitch" data-t="La Matanza de San Martín">La Matanza de San Martín</span> 🐷</h1><div class="drip"></div>
      <p>A cada cerdo le llega su San Martín… Alguien ya tiene tu nombre en una lista. Elige el tuyo.</p>
      <div class="names">${chips||'<p class="small">Cargando invitados…</p>'}</div>
      <p class="small" style="margin-top:14px">Lista sacada de la encuesta de WhatsApp.</p>
      ${S.join?`<form id="joinf" style="margin-top:8px"><input class="field txt" id="jn" maxlength="24" autocomplete="off" placeholder="Tu nombre" required>
        <button class="btn">Apuntarme</button></form>`:`<button class="btn ghost" id="joinb">¿No estás en la lista? Apúntate</button>`}
      ${!S.sel&&S.err?`<div class="err">${esc(S.err)}</div>`:""}
    </div>
    ${S.sel?`<form class="glass pad" id="pinf">
      <h2>${first?"Crea tu PIN":"Tu PIN"}</h2>
      <p>${first?"Es la primera vez que entras. Elige 4 cifras y no se las digas a nadie: con ellas verás tu personaje y, el sábado, tu misión.":"Mete tus 4 cifras."}</p>
      <input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" required>
      <button class="btn" id="go">${first?"Descubrir mi personaje":"Entrar"}</button>
      <div class="err">${esc(S.err)}</div>
    </form>`:""}
  </div>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.sel=b.dataset.n;S.err="";loginView();setTimeout(()=>{const i=$("#pin");i&&i.focus()},50)});
  const jb=$("#joinb"); if(jb) jb.onclick=()=>{S.join=true;S.sel=null;S.err="";loginView();setTimeout(()=>{const i=$("#jn");i&&i.focus()},50)};
  const jf=$("#joinf"); if(jf) jf.onsubmit=async e=>{e.preventDefault(); const n=$("#jn").value;
    try{ S.status=await rpc("matanza_join",{p_name:n}); S.join=false; S.sel=S.status.name; S.err=""; }catch(err){ S.err=err.message; }
    loginView(); setTimeout(()=>{const i=$("#pin");i&&i.focus()},50); };
  const f=$("#pinf"); if(f) f.onsubmit=async e=>{e.preventDefault(); const pin=$("#pin").value; $("#go").disabled=true;
    try{ await enter(S.sel,pin); }catch(err){ S.err=err.message; loginView(); } };
}

async function enter(name,pin){
  const me = await rpc("matanza_enter",{p_name:name,p_pin:pin});
  S.me=me; S.skew=new Date(me.now)-Date.now(); LS.set("sess",{name,pin}); S.err="";
  render();
}

/* ---- Pestañas ---- */
const TABS=[["tarjeta","🎭","Personaje"],["mision","🔪","Misión"],["reglas","📜","Reglas"]];
function nav(){
  tabsEl.classList.remove("hidden");
  tabsEl.innerHTML=TABS.map(([k,i,l])=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}"><span>${i}</span>${l}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
}
function header(){ return `<div class="top"><span class="tag">👤 ${esc(S.me.name)}</span><button class="link" id="out">Salir</button></div>`; }

function pendingView(){
  return `${header()}<div class="stack"><div class="glass pad">
    <div class="eyebrow">Personaje por confirmar</div><div class="emoji">🎭</div>
    <h1>Todavía no tienes personaje</h1>
    <p>Cuéntale a Mario <b>de qué te vas a disfrazar</b> y en cuanto lo sepa aparecerá aquí tu personaje, con su acción y su papel en la fiesta.</p></div></div>`;
}

function tarjetaView(ch){
  if(!ch) return pendingView();
  const song=SONGS[SONG_BY_NAME[S.me.name]]||"";
  return `${header()}
  <div class="stack">
    <div class="glass pad rel">
      <div class="stamp">CONFIDENCIAL</div>
      <div class="eyebrow">Expediente · ${esc(ch.scene)}</div>
      <div class="emoji">${ch.e}</div>
      <h1>${esc(ch.n)}</h1>
      ${ch.grupo?`<p>Sois tres: <b>${esc(ch.grupo)}</b>.</p>`:ch.con?`<p>Vas en pareja con <b>${esc(ch.con)}</b>.</p>`:`<p>Este disfraz solo lo lleváis tú y nadie más.</p>`}
    </div>
    <div class="glass pad">
      <h3>🗝️ Tu arma secreta (acción complementaria)</h3>
      <p class="big">${ch.comp}</p>
      <p class="small">Es otra forma de matar, ligada a tu disfraz. Solo vale con tu víctima y <b>una sola vez</b>: si lo intentas y no funciona, se gasta. Todos conocerán estas acciones el sábado.</p>
    </div>
    <div class="glass pad">
      <h3>🎭 Tu papel en la fiesta</h3>
      ${ch.papel.map(p=>`<h2>${esc(p.t)}</h2><p class="big">${esc(p.d)}</p>`).join("")}
    </div>
    ${song?`    <div class="glass pad">
      <h3>Tu canción maldita · escuelas</h3>
      <p class="big">🎵 <b>${esc(song)}</b></p>
      <p class="small">Cuando suene: o sales a bailar o bebes.</p>
    </div>`:""}
    <p class="small" style="text-align:center">Sin disfraz el sábado: chupito de penitencia y juegas sin acción complementaria ni papel.</p>
  </div>`;
}

function countdown(){
  const ms=new Date(S.me.start_at)-(Date.now()+S.skew);
  if(ms<=0) return "¡Ya!";
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  return (d?d+"d ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function misionView(ch){
  const rules = `<div class="glass pad"><h3>Cómo se mata</h3><ul class="list">
    <li><b>Acción secreta:</b> consigue que tu víctima la haga contigo. La puedes intentar todas las veces que quieras.</li>
    <li><b>Tu acción complementaria</b> (la de tu personaje): otra forma de matar, una sola vez.</li>
    <li>En cuanto lo consigas, dile <b>«estás muerto»</b>.</li>
    <li><b>Si te matan:</b> dile al oído a tu asesino tu víctima y tu acción secreta. Él sigue con ellas. Tu complementaria no se hereda. Y chupito de luto juntos ☠️</li>
    <li><b>A las 4:00 se acaba.</b> Gana quien más muertes lleve.</li></ul></div>`;
  if(!S.me.started) return `${header()}<div class="stack">
    <div class="glass pad"><div class="eyebrow">Misión bloqueada</div><div class="lock">🔒</div><h2>Alguien te está buscando. Y tú a alguien.</h2>
    <div class="count pulse" id="cd">${countdown()}</div><p class="small">${esc(fmtDate(S.me.start_at))}</p></div>${rules}</div>`;
  if(S.me.late||!S.me.target) return `${header()}<div class="stack">
    <div class="glass pad"><div class="eyebrow">Llegas tarde</div><h2>El sorteo ya está hecho</h2>
    <p>Díselo a Mario: puede repetir el sorteo para meterte.</p></div>${rules}</div>`;
  return `${header()}<div class="stack">
    <div class="glass pad">
      <div class="eyebrow">Objetivo · alto secreto</div>
      <div class="reveal" id="rv"><div class="inner">
        <h3>Tu víctima</h3><div class="victim">${esc(S.me.target)}</div>
        <div class="sp"></div><h3>Tu acción secreta</h3><p class="big"><b>${esc(ACTIONS[S.me.action_id]||"")}</b></p>
      </div><div class="hint"><span>🎯</span>Mantén pulsado para ver</div></div>
      <p class="small" style="margin-top:12px">Que no te vea nadie. Memorízalo y guarda el móvil.</p>
    </div>
    ${ch?`<div class="glass pad"><h3>Tu acción complementaria · un solo uso</h3><p class="big">${ch.comp}</p></div>`:""}
    ${rules}</div>`;
}

function reglasView(){
  return `${header()}<div class="stack">
    <div class="glass pad"><div class="eyebrow">Cañaveras · Sábado 7 de noviembre</div><h2>Cómo se juega</h2>
      <ul class="list">
        <li><b>Cada uno tiene una víctima</b> y tres cosas: una acción secreta, una acción complementaria (la de su personaje) y un papel en la fiesta.</li>
        <li><b>Acción secreta:</b> la tiene que hacer tu víctima contigo. La puedes intentar sin límite.</li>
        <li><b>Acción complementaria:</b> también la tiene que hacer tu víctima. Una sola vez: si fallas, se gasta.</li>
        <li><b>Matas</b> diciendo «estás muerto» cuando la víctima la hace. <b>Mueres</b> contándole al oído a tu asesino tu víctima y tu acción secreta, y os tomáis un chupito de luto.</li>
        <li><b>Sin disfraz:</b> chupito de penitencia y juegas sin acción complementaria ni papel.</li>
        <li><b>Premios:</b> mejor disfraz (votación de todos) y quien más haya matado.</li>
      </ul></div>
    <div class="glass pad"><h2>Programa de la noche</h2>
      <div class="tl">${PROGRAMA.map(([i,t,d])=>`<div class="it"><p class="big"><b>${i} ${esc(t)}</b></p><p>${esc(d)}</p></div>`).join("")}</div>
      <p class="small">Lo de beber vale igual con refresco: aquí no se queda nadie fuera.</p></div>
  </div>`;
}

let tick=null;
function render(){
  clearInterval(tick);
  if(!S.me) return loginView();
  const ch=CHARACTERS[S.me.character_id]||null;
  paintBg(ch); nav(); scrollTo(0,0);
  app.innerHTML = S.tab==="mision"?misionView(ch):S.tab==="reglas"?reglasView():tarjetaView(ch);
  $("#out").onclick=()=>{LS.del("sess");S.me=null;S.sel=null;S.tab="tarjeta";boot()};
  const rv=$("#rv"); if(rv){const on=e=>{e.preventDefault();rv.classList.add("open")},off=()=>rv.classList.remove("open");
    rv.addEventListener("pointerdown",on);rv.addEventListener("pointerup",off);rv.addEventListener("pointerleave",off);rv.addEventListener("pointercancel",off);
    rv.addEventListener("contextmenu",e=>e.preventDefault());}
  if(S.tab==="mision"&&!S.me.started){ tick=setInterval(async()=>{const el=$("#cd"); if(!el) return; el.textContent=countdown();
      if(new Date(S.me.start_at)<=Date.now()+S.skew){ clearInterval(tick); const s=LS.get("sess"); if(s) try{await enter(s.name,s.pin)}catch(e){} } },1000); }
}

async function boot(){
  loginView();
  const s=LS.get("sess",null);
  if(s){ try{ await enter(s.name,s.pin); return; }catch(e){ LS.del("sess"); } }
  try{ S.status=await rpc("matanza_status"); }catch(e){ S.err="No se puede conectar. Prueba otra vez en un momento."; }
  loginView();
}
function intro(){
  if(sessionStorage.getItem("intro")) return; try{sessionStorage.setItem("intro","1")}catch(e){}
  const d=document.createElement("div"); d.className="intro";
  d.innerHTML='<div class="slash"></div><div class="pig">🐷</div><div class="l1"></div>'; document.body.appendChild(d);
  const t="A cada cerdo le llega su San Martín…", el=d.querySelector(".l1"); let i=0;
  const iv=setInterval(()=>{el.textContent=t.slice(0,++i); if(i>=t.length){clearInterval(iv);
    setTimeout(()=>d.classList.add("cut"),500); setTimeout(()=>d.classList.add("out"),1100); setTimeout(()=>d.remove(),2200);}},55);
  d.onclick=()=>{clearInterval(iv);d.classList.add("out");setTimeout(()=>d.remove(),900)};
}
intro();
boot();
</script>
