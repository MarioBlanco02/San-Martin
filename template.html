/* ============ SERVIDOR (Supabase) o MODO PRUEBA ============ */
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
            del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function rpc(fn, args){
  if(CFG){
    const r = await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{"Content-Type":"application/json",apikey:CFG.key,Authorization:"Bearer "+CFG.key},body:JSON.stringify(args||{})});
    const j = await r.json().catch(()=>null);
    if(!r.ok) throw new Error((j&&(j.message||j.hint))||"Error de conexión");
    return j;
  }
  return mock(fn,args||{});
}

/* Modo prueba: simula el servidor en este navegador. ?ahora en la URL desbloquea las misiones. */
function mock(fn,a){
  const db = LS.get("mock.db",null) || {roster:["Mario","Laura","Javi","Ana","Pablo","Lucía"],players:{},missions:null};
  const start = new URL(location.href).searchParams.has("ahora") ? new Date(Date.now()-1000) : new Date("2026-11-07T21:30:00+01:00");
  const save=()=>LS.set("mock.db",db), rnd=n=>1+Math.floor(Math.random()*n);
  if(fn==="matanza_status") return {roster:db.roster,claimed:Object.keys(db.players),start_at:start.toISOString(),now:new Date().toISOString()};
  if(!/^\d{4}$/.test(a.p_pin)) throw new Error("El PIN son 4 cifras");
  let p=db.players[a.p_name], late=false;
  if(!p){ const used=Object.values(db.players).map(x=>x.c); let c; do{c=rnd(20)}while(used.includes(c)&&used.length<20);
    p=db.players[a.p_name]={pin:a.p_pin,c,s:rnd(24)}; late=!!db.missions; }
  else if(p.pin!==a.p_pin) throw new Error("PIN incorrecto");
  const started = Date.now()>=start;
  if(started && !db.missions){ const ns=Object.keys(db.players).sort(()=>Math.random()-.5); db.missions={};
    ns.forEach((n,i)=>db.missions[n]={t:ns[(i+1)%ns.length],a:rnd(30)}); }
  save(); const m=db.missions&&db.missions[a.p_name]; if(started&&!m) late=true;
  return {name:a.p_name,character_id:p.c,song_id:p.s,start_at:start.toISOString(),now:new Date().toISOString(),started,late,target:m?m.t:null,action_id:m?m.a:null};
}

function paintBg(ch){
  const r=document.documentElement.style;

  const pat = ch?ch.pat:["🐷","🔪","🍷","🎂"];
  let h = `<div class="hero">${ch?ch.e:"🐷"}</div>`;
  for(let i=0;i<16;i++){ const x=(i*37)%100, y=(i*61)%100, d=(i%5)*1.7;
    h+=`<div class="pat" style="left:${x}%;top:${y}%;animation-delay:-${d}s">${pat[i%pat.length]}</div>`; }
  bg.innerHTML=h;
}

    <div class="glass pad">
      <div class="eyebrow">Cañaveras · Sábado 7 de noviembre</div>
      <h1>La Matanza de San Martín 🐷</h1>
      <p>A cada cerdo le llega su San Martín… Elige tu nombre para ver tu personaje.</p>
      <div class="names">${chips||'<p class="small">Cargando invitados…</p>'}</div>
    </div>
    ${S.sel?`<form class="glass pad" id="pinf">
      <h2>${first?"Crea tu PIN":"Tu PIN"}</h2>
      <p>${first?"Es la primera vez que entras. Elige 4 cifras y no se las digas a nadie: con ellas verás tu misión el sábado.":"Mete tus 4 cifras."}</p>
      <input class="field" id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" required>
      <button class="btn" id="go">${first?"Descubrir mi personaje":"Entrar"}</button>
      <div class="err">${esc(S.err)}</div>
    </form>`:""}
  </div>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.sel=b.dataset.n;S.err="";loginView();setTimeout(()=>{const i=$("#pin");i&&i.focus()},50)});
  const f=$("#pinf"); if(f) f.onsubmit=async e=>{e.preventDefault(); const pin=$("#pin").value; $("#go").disabled=true;
    try{ await enter(S.sel,pin); }catch(err){ S.err=err.message; loginView(); } };
}

async function enter(name,pin){
  const me = await rpc("matanza_enter",{p_name:name,p_pin:pin});
  S.me=me; S.skew=new Date(me.now)-Date.now(); LS.set("sess",{name,pin}); S.err="";
  render();
}

/* ---- Pestañas ---- */
const TABS=[["tarjeta","🎭","Personaje"],["mision","🔪","Misión"],["juegos","🎲","Juegos"],["programa","🗓️","Programa"]];
function nav(){
  tabsEl.classList.remove("hidden");
  tabsEl.innerHTML=TABS.map(([k,i,l])=>`<button class="tab ${S.tab===k?"on":""}" data-t="${k}"><span>${i}</span>${l}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
}

function header(){ return `<div class="top"><span class="tag">👤 ${esc(S.me.name)}</span><button class="link" id="out">Salir</button></div>`; }

function tarjetaView(ch){
  const song=SONGS[S.me.song_id]||"";
  return `${header()}
  <div class="stack">
    <div class="glass pad">
      <div class="eyebrow">Tu personaje · ${esc(ch.scene)}</div>
      <div class="emoji">${ch.e}</div>
      <h1>${esc(ch.n)}</h1>
      <p>Ven caracterizado con lo que tengas por casa.</p>
    </div>
    <div class="glass pad">
      <h3>Tu disfraz</h3>
      <div class="row"><div class="ic">⭐</div><div><p class="big"><b>${esc(ch.key)}</b></p><p class="small">Pieza clave obligatoria. Sin ella: chupito de penitencia y juegas sin arma.</p></div></div>
      <div class="sp"></div>
      <h3>Extras para currártelo</h3>
      <ul class="list">${ch.extras.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    <div class="glass pad">
      <h3>Tu arma · un solo uso</h3>
      <p class="big">${ch.arma}</p>
      <p class="small">Todo el mundo conoce las armas de los disfraces… pero nadie sabe a por quién vas.</p>
    </div>
    <div class="glass pad">
      <h3>Tu canción maldita · escuelas</h3>
      <p class="big">🎵 <b>${esc(song)}</b></p>
      <p class="small">Cuando suene: o sales a bailar o bebes.</p>
    </div>
  </div>`;
}

function countdown(){
  const ms=new Date(S.me.start_at)-(Date.now()+S.skew);
  if(ms<=0) return "¡Ya!";
  const d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  return (d?d+"d ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function misionView(ch){
  const rules = `<div class="glass pad"><h3>Cómo se mata</h3><ul class="list">
    <li><b>Acción secreta:</b> consigue que tu víctima la haga contigo. Puedes intentarlo las veces que quieras.</li>
    <li><b>Tu arma:</b> la otra forma de matar, la de tu disfraz. Vale una sola vez.</li>
    <li>En cuanto lo consigas, dile <b>«estás muerto»</b>.</li>
    <li><b>Si te matan:</b> dile al oído a tu asesino tu víctima y tu acción secreta. Él sigue con ellas. Tu arma no se hereda. Y chupito de luto juntos ☠️</li>
    <li>Si te toca de víctima tú mismo, eres el último vivo: <b>¡has ganado!</b></li>
    <li><b>A las 4:00 se acaba.</b> Gana quien más muertes lleve.</li></ul></div>`;
  if(!S.me.started) return `${header()}<div class="stack">
    <div class="glass pad"><div class="eyebrow">Misión bloqueada</div><h2>Tu víctima se revela en la cena</h2>
    <div class="count" id="cd">${countdown()}</div><p class="small">${esc(fmtDate(S.me.start_at))}</p></div>${rules}</div>`;
  if(S.me.late||!S.me.target) return `${header()}<div class="stack">
    <div class="glass pad"><div class="eyebrow">Llegas tarde</div><h2>El sorteo ya está hecho</h2>
    <p>Díselo al cumpleañero: puede repetir el sorteo para meterte.</p></div>${rules}</div>`;
  return `${header()}<div class="stack">
    <div class="glass pad">
      <div class="eyebrow">Tu misión · secreta</div>
      <div class="reveal" id="rv"><div class="inner">
        <h3>Tu víctima</h3><div class="victim">${esc(S.me.target)}</div>
        <div class="sp"></div><h3>Tu acción secreta</h3><p class="big"><b>${esc(ACTIONS[S.me.action_id]||"")}</b></p>
      </div><div class="hint">👆 Mantén pulsado para ver</div></div>
      <p class="small" style="margin-top:12px">Que no te vea nadie. Memorízalo y guarda el móvil.</p>
    </div>
    <div class="glass pad"><h3>Tu arma · un solo uso</h3><p class="big">${ch.arma}</p></div>
    ${rules}</div>`;
}

function juegosView(){
  const n=S.norma; const left=n?Math.max(0,20*60e3-(Date.now()-n.t)):0;
  return `${header()}<div class="stack">
    <div class="glass pad">
      <div class="eyebrow">Cena</div><h2>Las normas del pueblo</h2>
      <div class="norma" id="nm">${n?esc(NORMAS[n.i]):"Pulsa para sacar la primera norma."}</div>
      <div class="timer" id="nt">${n?(left>0?"Siguiente norma en "+fmtLeft(left):"⏰ ¡Toca norma nueva!"):"Cada norma dura 20 minutos. Quien la incumpla, bebe."}</div>
      <button class="btn" id="nb">${n?"Nueva norma":"Sacar norma"}</button>
    </div>
    <div class="glass pad"><div class="eyebrow">Llegada</div><h2>Control de disfraces</h2>
      <p>Revisión en la puerta del garaje. Sin la pieza clave ⭐: chupito de penitencia y juegas sin arma.</p></div>
    <div class="glass pad"><div class="eyebrow">Sobremesa</div><h2>El Juicio de la Matanza ⚖️</h2>
      <p>En corro y por turnos, cada uno señala a quien cree que va a por él. El acusado tiene que decir la verdad.</p>
      <ul class="list"><li><b>Aciertas:</b> bebe el acusado (y ya sabes de quién cuidarte).</li><li><b>Fallas:</b> bebes tú.</li></ul></div>
    <div class="glass pad"><div class="eyebrow">Escuelas</div><h2>Canción maldita 🎵</h2>
      <p>La tuya está en tu tarjeta. Cuando suene: o sales a bailar o bebes.</p></div>
    <div class="glass pad"><div class="eyebrow">Toda la noche</div><h2>Chupito de luto ☠️</h2>
      <p>Cada muerte se celebra: la víctima se toma un chupito con su asesino.</p></div>
    <div class="glass pad"><div class="eyebrow">4:00</div><h2>Premios 🏆</h2>
      <ul class="list"><li><b>Matarife del año:</b> más muertes.</li><li><b>Mejor disfraz:</b> votación.</li><li><b>Muerte más absurda:</b> votación.</li></ul></div>
  </div>`;
}
const fmtLeft=ms=>{const m=Math.floor(ms/6e4),s=Math.floor(ms/1e3)%60;return m+":"+String(s).padStart(2,"0")};

function programaView(){
  return `${header()}<div class="glass pad"><div class="eyebrow">Sábado 7 · Cañaveras</div><h2>Programa de la noche</h2>
  <div class="tl">${PROGRAMA.map(([i,t,d])=>`<div class="it"><p class="big"><b>${i} ${esc(t)}</b></p><p>${esc(d)}</p></div>`).join("")}</div>
  <p class="small">Lo de beber vale igual con refresco: aquí no se queda nadie fuera.</p></div>`;
}

let tick=null;
function render(){
  clearInterval(tick);
  if(!S.me) return loginView();
  const ch=CHARACTERS[S.me.character_id]||CHARACTERS[1];
  paintBg(ch); nav();
  app.innerHTML = S.tab==="mision"?misionView(ch):S.tab==="juegos"?juegosView():S.tab==="programa"?programaView():tarjetaView(ch);
  $("#out").onclick=()=>{LS.del("sess");S.me=null;S.sel=null;S.tab="tarjeta";boot()};
  const rv=$("#rv"); if(rv){const on=e=>{e.preventDefault();rv.classList.add("open")},off=()=>rv.classList.remove("open");
    rv.addEventListener("pointerdown",on);rv.addEventListener("pointerup",off);rv.addEventListener("pointerleave",off);rv.addEventListener("pointercancel",off);
    rv.addEventListener("contextmenu",e=>e.preventDefault());}
  const nb=$("#nb"); if(nb) nb.onclick=()=>{let i; do{i=Math.floor(Math.random()*NORMAS.length)}while(S.norma&&i===S.norma.i);
    S.norma={i,t:Date.now()}; LS.set("norma",S.norma); render();};
  if(S.tab==="mision"&&!S.me.started){ tick=setInterval(async()=>{const el=$("#cd"); if(!el) return; el.textContent=countdown();
      if(new Date(S.me.start_at)<=Date.now()+S.skew){ clearInterval(tick); const s=LS.get("sess"); if(s) try{await enter(s.name,s.pin)}catch(e){} } },1000); }
  if(S.tab==="juegos"&&S.norma){ tick=setInterval(()=>{const el=$("#nt"); if(!el) return; const left=20*60e3-(Date.now()-S.norma.t);
      el.textContent=left>0?"Siguiente norma en "+fmtLeft(left):"⏰ ¡Toca norma nueva!"},1000); }
}

async function boot(){
  loginView();
  const s=LS.get("sess",null);
  if(s){ try{ await enter(s.name,s.pin); return; }catch(e){ LS.del("sess"); } }
  try{ S.status=await rpc("matanza_status"); }catch(e){ S.err="No se puede conectar. Prueba otra vez en un momento."; }
  loginView();
}
boot();
</script>
</body>
</html>
